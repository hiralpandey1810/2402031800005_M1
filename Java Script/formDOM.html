<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form using DOM</title>

</head>
<body>
   <form name="myForm">
    <input type="text" name="uname">
    <input type="text" name="password">
    <input type="button" value="Submit" onclick="myFunction()">
   </form> 
   <script>
    function myFunction(){
        var a =document.forms["myForm"];
        var u = a["uname"].value;
        var p = a["password"].value;
        if(u == "Hiral" && p == "12345"){
            alert("Login successful");
        }
        else{
            alert("Login failed");
        }
    }
   </script>
</body>
</html>
