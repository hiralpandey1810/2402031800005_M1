<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var str= "Java";
        var str1= "Script"
        document.write(str.charAt(3));
        document.write("<br><br>");
        document.write(str.concat (" ",str1))
        document.write("<br><br>");
        document.write(str.indexOf("a"));
        document.write("<br><br>");
        document.write(str.lastIndexOf("J"));
        document.write("<br><br>");
        document.write(str.search("va"));
        document.write("<br><br>");
        document.write(str.match("va"));
        document.write("<br><br>");
        document.write(str.replace("Java","Mava"));
        document.write("<br><br>");
        document.write(str1.substring(0,3));
        document.write("<br><br>");
        document.write(str1.slice(1,4));
        document.write("<br><br>");
        document.write(str1.toLocaleLowerCase());
        document.write("<br><br>");
        

    </script>
</body>
</html>
