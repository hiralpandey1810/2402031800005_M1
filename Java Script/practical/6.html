<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap year</title>
</head>
<body>
    <script>
        var year= prompt ("enter year");
        if(year%4==0){
            document.write("This is leap year");
        }
        else{
            document.write("this is not a leap year");
        }
    </script>
</body>
</html>
