<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pass or Fail</title>
</head>
<body>
    <script>
        var mark=prompt("Enter your marks");
        if(mark>=35) {
            document.write("You have passed the exam");
        }
        else{
            alert("Oh no! You are failed")
        }
    </script>
</body>
</html>
