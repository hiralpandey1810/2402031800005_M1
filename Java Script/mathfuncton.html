<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Math Function </title>
    <style>
        header{
            text-align: center;
            color: blue;
        }
        h3{
            color: red;
            align-items: center;
            background-color: black;
        }
        .demo1{
            position: absolute;
            height: 120px;
            width: 150px;
            top: 20px;
            left:10px;
            background-color: lightblue;
            text-align: center;
        }
        .demo2{
            position: absolute;
            height: 120px;
            width: 150px;
            top: 20px;
            left:200px;
            background-color: pink;
            text-align: center;
        }
        .demo3{
             position: absolute;
            height: 120px;
            width: 150px;
            top: 20px;
            left:400px;
            background-color: yellow;
            text-align: center;
        }
        .demo4{
            position: absolute;
            height: 120px;
            width: 150px;
            top: 150px;
            left:10px;
            background-color: lightgreen;
            text-align: center;
        }
        .demo5{
            position: absolute;
            height: 120px;
            width: 150px;
            top: 150px;
            left:200px;
            background-color: lightblue;
            text-align: center;
        }
        .demo6{
            position: absolute;
            height: 120px;
            width: 150px;
            top: 150px;
            left:400px;
            background-color: cyan;
            text-align: center;
        }
        .demo7{
            position: absolute;
            height: 120px;
            width: 150px;
            top: 300px;
            left:10px;
            background-color: lightseagreen;
            text-align: center;
        }
        .demo8{
            position: absolute;
            height: 120px;
            width: 150px;
            top: 300px;
            left:200px;
            background-color: lightslategray;
            text-align: center;
        }
        .demo9{
            position: absolute;
            height: 120px;
            width: 150px;
            top: 300px;
            left:400px;
            background-color: lightgray;
            text-align: center;
        }

    </style>
</head>
<body>
    <header>
        <h1>Math Function in JavaScript</h1>
        </header>
    
    <div class="demo1">
    <h3> Euler's Number </h3>
    <script>
        document.write(Math.E);
        </script>
        </div>
    <div class="demo2">
        <h3>Pi Number</h3>
        <script>
        document.write(Math.PI);
        </script>
        </div>
      <div class="demo3">
        <h3>Square Function</h3>
        <script>
       document.write(Math.sqrt(16));
        </script>
        </div>
         <div class="demo4">
        <h3>Power Function</h3>
        <script>
            document.write(Math.pow(2, 3));
        </script>
        </div>
          <div class="demo5">
        <h3>Absolute Function</h3>
        <script>

        document.write(Math.abs(-5));
        </script>
        </div>
          <div class="demo6">
        <h3>Trigonometry Function</h3>
        <script>
        document.write(Math.sin(45));
        document.write("<br>");
        document.write(Math.cos(45));

        </script>
        </div>
          <div class="demo7">
        <h3>Floor Function</h3>
        <script>
        document.write(Math.floor(4.7));
        </script>
        </div>
          <div class="demo8">
        <h3>Random Function</h3>
        <script>
               document.write(Math.random());
        </script>
        </div>
          <div class="demo9">
        <h3>Max and Min Function</h3>
        <script>
          document.write(Math.max(10, 20));
          document.write("<br>");
         document.write(Math.min(10, 20));
        </script>
        </div>
                
    </script>
    
</body>
</html>
