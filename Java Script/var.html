<html>
    <head> 
        <link rel="stylesheet" href="ab.css">
        <body>
        <h2> Variable Practical</h2>
        <p id="demo1"></p>
        <p id="demo2"></p>
        <p id="demo3"></p>
        <p id="demo4"></p>
        <script>
            var x=6;
            var y=8;
            var a=x+y;
            var m=x*y;
            var s=x-y;
            var d=x/y;
            document.getElementById("demo1").innerHTML= "value of a is" +a;
            document.getElementById("demo2").innerHTML= "value of m is" +m;
            document.getElementById("demo3").innerHTML= "value of s is" +s;
            document.getElementById("demo4").innerHTML= "value of d is" +d;
            
        </script>
        </body>
    </head>
</html>
