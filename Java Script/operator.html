<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        <!--Increment and Decrement-->
        var inc=5;
        inc++;
        document.write(inc + "<br>");
        ++inc;
        document.write(inc + "<br>");
        var dec=8;
        dec--;
        document.write(dec + "<br>");
        --dec;
        document.write(dec + "<br>");
        var x=7;
        var y=8;
         document.write(x>y);
         document.write(x<y);
         document.write(x==y);
         document.write(x===y);
         document.write(x!=y + "<br>");

        
    </script>
</body>
</html>
