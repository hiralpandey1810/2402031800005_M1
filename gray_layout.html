<!DOCTYPE html>
<html>
<head>
<style>

body{
  background:gray;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  width:200px;
  height:200px;
  background:gray;
  border-radius:10px;
  transition:0.3s;
}

.box:hover{
  transform:scale(1.1);
  background:black;
}

</style>
</head>

<body>

<div class="box"></div>

</body>
</html>
